site_name: Orelia Documentation
site_description: Orelia Minecraft RPG プラグインの遊び方・管理者ガイド
site_url: https://orelia-mc.github.io/orelia-docs/
repo_name: orelia-mc/orelia-docs
repo_url: https://github.com/orelia-mc/orelia-docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - ホーム: index.md
  - 遊び方:
      - はじめに: play/index.md
      - レベル・ステータス・職業: play/growth.md
      - 戦闘・武器スキル: play/combat.md
      - 装備・アイテム: play/items.md
      - クエスト・NPC: play/quest.md
      - ダンジョン: play/dungeon.md
      - パーティー・ギルド・フレンド: play/social.md
      - チャット: play/chat.md
      - 経済(ショップ・トレード・オークション・メール): play/economy.md
      - 実績・ランキング・称号: play/progress.md
      - 住居・ペット・乗り物: play/housing.md
      - 採取(釣り・木こり・採掘・農業): play/gathering.md
      - コマンド一覧: play/commands.md
  - 管理者ガイド:
      - 概要: admin/index.md
      - orelia-core 管理コマンド: admin/core-commands.md
      - orelia-debug テストプレイ支援: admin/debug-tools.md
      - orelia-serverutil: admin/serverutil.md
      - コマンド一覧: admin/reference.md
